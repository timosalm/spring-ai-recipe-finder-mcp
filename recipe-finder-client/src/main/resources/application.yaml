spring:
  application.name: recipe-finder-client
  ai:
    model:
      chat: ollama
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama.chat:
      model: llama3.2
      options.temperature: 0.5
    mcp.client:
      sse.connections:
        server1.url: http://localhost:8081
        server2.url: http://localhost:8082
  docker.compose.lifecycle-management: none
logging.level.io.modelcontextprotocol:
  client: DEBUG
  spec: DEBUG